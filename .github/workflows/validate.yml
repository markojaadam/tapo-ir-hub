name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  focused-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile integration
        run: python -m compileall -q custom_components/tapo_ir
      - name: Check control card syntax
        run: node --check custom_components/tapo_ir/frontend/tapo-ir-control-card.js
